server.port=8080
spring.application.name=ib-lab-1
spring.config.import=optional:file:.env[.properties]

# Database. Credentials come from the environment, never from the repository.
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:iblab1}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PG_USERNAME:iblab1}
spring.datasource.password=${PG_PASSWORD:iblab1}

# Schema is owned by Liquibase, Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml

# JWT settings. The secret must be supplied via JWT_SECRET outside of local development.
jwt.secret=${JWT_SECRET:local-development-secret-key-that-is-at-least-256-bits-long-change-me-in-production}
jwt.expiration=3600000

# Do not leak stack traces or internals through error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
