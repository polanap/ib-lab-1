services:
  postgres:
    image: postgres:16-alpine
    container_name: iblab1-postgres
    environment:
      POSTGRES_DB: ${PG_DATABASE:-iblab1}
      POSTGRES_USER: ${PG_USERNAME:-iblab1}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-iblab1}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-iblab1} -d ${PG_DATABASE:-iblab1}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
